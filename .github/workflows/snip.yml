name: snip

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  snip:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/snip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/snip/go.mod
          cache-dependency-path: desktop/snip/go.sum
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: build
        run: go build ./...
