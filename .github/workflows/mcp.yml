name: mcp

on:
  pull_request:
    paths:
      - server/mcp/**
      - server/clip/**
      - .github/workflows/mcp.yml
  push:
    branches: [main]
    paths:
      - server/mcp/**
      - server/clip/**
      - .github/workflows/mcp.yml

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/mcp/go.mod
          cache-dependency-path: |
            server/mcp/go.sum
            server/clip/go.sum
      # The seam test (realclip_test.go) runs the MCP tools against the REAL
      # clipstore, so a change on either side of the API is caught here.
      # REQUIRE_REAL_CLIP turns that test's local skip into a failure.
      - name: build clipstore for the seam test
        working-directory: server/clip
        env:
          CGO_ENABLED: "0"
        run: go build -o "$RUNNER_TEMP/clipstore" .
      - name: gofmt
        working-directory: server/mcp
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet + test (CGO off, as the binary is built)
        working-directory: server/mcp
        env:
          CGO_ENABLED: "0"
          CLIPSTORE_BIN: ${{ runner.temp }}/clipstore
          REQUIRE_REAL_CLIP: "1"
        run: |
          go vet ./...
          go test -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/test.log"
          # Count, don't trust the exit code alone: the seam test must have
          # RUN and passed, not skipped.
          grep -q -- '--- PASS: TestAgainstTheRealClipstore' "$RUNNER_TEMP/test.log"
          ! grep -q -- '--- SKIP' "$RUNNER_TEMP/test.log"
