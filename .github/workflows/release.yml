name: release images

# Images are pushed to GHCR ONLY from a `v*` tag. The opt-in cohere (GPU) image
# is not published: it is several GB, and compose builds it locally for the few
# users who opt in.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: promptshipper-stt
            context: server/stt
            file: server/stt/Dockerfile
          - name: promptshipper-clip
            context: server/clip
            file: server/clip/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zacxdev/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The Helm chart, packaged with the tag's version (chart version ==
  # appVersion == the image tag above) and pushed to
  # oci://ghcr.io/zacxdev/charts/promptshipper. `needs: image` waits for EVERY
  # matrix leg and is skipped if any fails, so a chart is never published that
  # points at an image tag which does not exist.
  chart:
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: lint, package and push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm lint --strict deploy/helm/promptshipper \
            --set stt.auth.existingSecret=release-stt-auth --set clip.auth.existingSecret=release-clip-auth
          helm package deploy/helm/promptshipper --version "$version" --app-version "$version" -d dist
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "dist/promptshipper-${version}.tgz" oci://ghcr.io/zacxdev/charts
