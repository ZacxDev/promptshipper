{{- if .Values.networkPolicy.enabled }}
{{- range $component := list "stt" "clip" }}
{{- $c := index $.Values $component }}
{{- if $c.enabled }}
{{- $ctx := dict "root" $ "component" $component "c" $c }}
{{- $from := index $.Values.networkPolicy $component "from" }}
{{- /* A policy with no `from` admits every source on the port: it would look
       like isolation while providing none. Refuse it. */}}
{{- if not $from }}
{{- fail (printf "networkPolicy.enabled=true needs a non-empty networkPolicy.%s.from (the peers allowed to reach %s); an empty list admits every source and isolates nothing" $component $component) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "promptshipper.componentName" $ctx }}
  labels:
    {{- include "promptshipper.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "promptshipper.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- toYaml $from | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}
